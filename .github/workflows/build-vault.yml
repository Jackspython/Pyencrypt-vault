name: Build Vault Binaries

on:
  workflow_dispatch:

jobs:
  build-arm64:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Build ${{ matrix.python }} ARM64
        run: |
          mkdir -p vault
          docker run --rm --platform linux/arm64 \
            -v "$PWD":/work -w /work \
            arm64v8/python:${{ matrix.python }}-slim \
            bash -c "
              pip install --quiet cython &&
              python enc10.py test_app.py --build-only --no-inject --opt=-O1 -o vault/${{ matrix.python }}.arm64
            "
          ls -la vault/

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.python }}-arm64
          path: vault/${{ matrix.python }}.arm64
          if-no-files-found: error

  combine:
    needs: [build-arm64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: all-binaries

      - name: Collect
        run: |
          mkdir -p vault
          find all-binaries -type f -exec cp {} vault/ \;
          ls -la vault/

      - name: Tarball
        run: tar -czf vault.tar.gz vault/

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: vault-complete
          path: vault.tar.gz
          if-no-files-found: error
