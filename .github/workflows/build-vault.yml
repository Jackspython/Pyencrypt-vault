name: Build Vault Binaries

on:
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install Cython
        run: pip install cython

      - name: Build ${{ matrix.python }}
        run: |
          mkdir -p vault
          python enc10.py test_app.py --build-only --no-inject --opt=-O1 -o vault/${{ matrix.python }}.x86_64
          ls -la vault/

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.python }}-linux
          path: vault/${{ matrix.python }}.x86_64
          if-no-files-found: warn

  build-windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install Cython
        run: pip install cython
        shell: pwsh

      - name: Build ${{ matrix.python }}
        run: |
          mkdir vault -Force
          python enc10.py test_app.py --build-only --no-inject --opt=-O1 -o vault/${{ matrix.python }}.win.exe
          dir vault
        shell: pwsh

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.python }}-win
          path: vault/${{ matrix.python }}.win.exe
          if-no-files-found: warn

  combine:
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: all-binaries

      - name: Collect
        run: |
          mkdir -p vault
          find all-binaries -type f -exec cp {} vault/ \;
          ls -la vault/

      - name: Tarball
        run: tar -czf vault.tar.gz vault/

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: vault-complete
          path: vault.tar.gz
          if-no-files-found: error
