name: Build Vault Binaries

on:
  workflow_dispatch:

jobs:
  build-linux-arm64:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install Cython
        run: pip install cython

      - name: Prepare workspace
        run: |
          mkdir -p vault
          cp test_app.py vault/ 2>/dev/null || echo "print('vault')" > vault/test_app.py

      - name: Build ${{ matrix.python }} arm64
        run: |
          cd vault
          python ../enc10.py test_app.py --build-only -o ${{ matrix.python }}.arm64 --opt -O1
        continue-on-error: true

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.python }}-arm64
          path: vault/${{ matrix.python }}.arm64
          if-no-files-found: warn

  build-windows:
    runs-on: windows-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install Cython
        run: pip install cython
        shell: pwsh

      - name: Prepare workspace
        run: |
          mkdir vault
          if (Test-Path test_app.py) { Copy-Item test_app.py vault/ }
          else { Set-Content vault/test_app.py "print('vault')" }
        shell: pwsh

      - name: Build ${{ matrix.python }} win
        run: |
          cd vault
          python ../enc10.py test_app.py --build-only -o ${{ matrix.python }}.win.exe --opt -O1
        shell: pwsh
        continue-on-error: true

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.python }}-win
          path: vault/${{ matrix.python }}.win.exe
          if-no-files-found: warn

  combine:
    needs: [build-linux-arm64, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: all-binaries

      - name: Collect
        run: |
          mkdir -p vault
          find all-binaries -type f -exec cp {} vault/ \;
          ls -la vault/

      - name: Create tarball
        run: tar -czf vault.tar.gz vault/

      - name: Upload final vault
        uses: actions/upload-artifact@v4
        with:
          name: vault-complete
          path: vault.tar.gz
          if-no-files-found: error
